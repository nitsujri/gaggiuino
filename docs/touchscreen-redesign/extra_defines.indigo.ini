[platformio]
default_envs = all-pcb-stlink

[extra]
build_flags =
	-DINDIGO_UI
	-DTOF_VL53L0X
	; Internal CLK pull-up needs a slower edge interval on this installed board.
	-DHX711_CLOCK_PULLUP
	-DHX711_CLOCK_HALF_PERIOD_US=16
	; Automatic idle pressure release is blocked unless the hardware scales
	; report at least this much gross load. Until the two no-tray raw offsets
	; below are supplied, or Menu > Tray guard captures and saves the no-tray
	; baseline, the guard deliberately fails closed. Validate the minimum load.
	-DDRIP_TRAY_GUARD_ENABLED=1
	-DDRIP_TRAY_MIN_WEIGHT_G=150.0f
	; -DDRIP_TRAY_ZERO_RAW_1=<calibration-output>
	; -DDRIP_TRAY_ZERO_RAW_2=<calibration-output>
	;
	; Installed scales: Gaggiuino compact dual-HX711 board with FPC connector,
	; connected to CoffeeHat PCB v3.0 J8. This uses the normal shared-clock,
	; two-data-channel interface; hardware scales are enabled by default.
	; Do not enable predictive scales.
	;
	; Do not uncomment this for the installed dual-HX711/FPC board. Enable it
	; only if that board is replaced with one ordinary HX711 module:
	; -DSINGLE_HX711_BOARD
