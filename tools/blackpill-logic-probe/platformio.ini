[platformio]
default_envs = probe-stlink

[probe]
; USB serial of the spare, deliberately different from the installed controller.
dfu_serial = 349C39803133

[env]
platform = ststm32@15.6.0
board = blackpill_f411ce
framework = arduino
build_type = release
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBCON
    -DUSB_PRODUCT_STRING=\"BlackPill_Logic_Probe\"
    -O3
build_unflags = -Os
monitor_speed = 115200

[env:probe-stlink]
upload_protocol = stlink

[env:probe-dfu]
; Use the working native dfu-util on PATH. PlatformIO's older macOS binary
; depends on an unavailable Intel Homebrew libusb on this machine.
upload_protocol = custom
upload_command = dfu-util -d 0483:df11 -S ${probe.dfu_serial} -a 0 -s 0x08000000:leave -D $SOURCE
