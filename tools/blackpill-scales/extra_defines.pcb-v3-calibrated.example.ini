[platformio]
default_envs = all-pcb-stlink

[extra]
build_flags =
    -DTOF_VL53L0X
    -DHX711_CLOCK_PULLUP
    -DHX711_CLOCK_HALF_PERIOD_US=16
    -DDRIP_TRAY_GUARD_ENABLED=1
    -DDRIP_TRAY_MIN_WEIGHT_G=205.0f
    ; Calibrated no-tray reference, 2026-10-17. Empty tray weighed273.45g.
    -DDRIP_TRAY_ZERO_RAW_1=-140084L
    -DDRIP_TRAY_ZERO_RAW_2=191846L
    ; Shared-clock dual HX711: leave SINGLE_HX711_BOARD undefined.
